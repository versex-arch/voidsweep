name: Release

# Every push to main builds the three apps (downloadable from the run's Artifacts),
# so a broken build is caught before tagging. Pushing a v* tag also publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Voidsweep-windows.zip
          - os: macos-latest
            artifact: Voidsweep-macos.zip
          - os: ubuntu-latest
            artifact: Voidsweep-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install . pyinstaller pillow send2trash
      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --windowed --name Voidsweep
          --icon packaging/icon.png
          --paths .
          --collect-submodules voidsweep
          --add-data "voidsweep/web:voidsweep/web"
          ${{ runner.os == 'macOS' && '--osx-bundle-identifier io.github.versex-arch.voidsweep' || '--onefile' }}
          packaging/entry.py
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/Voidsweep.app/Contents/MacOS/Voidsweep; else BIN=dist/Voidsweep; fi
          "$BIN" --version
          "$BIN" markers --lang en
          "$BIN" scan --lang en
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.artifact }} Voidsweep.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent Voidsweep.app ../${{ matrix.artifact }}
          else tar czf ../${{ matrix.artifact }} Voidsweep; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: Voidsweep-*
          generate_release_notes: true
