[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voidsweep"
dynamic = ["version"]
description = "Transparent cross-platform junk cleaner: every file it proposes to remove comes with a marker code and a reason."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "versex-arch" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["cleaner", "disk", "junk", "cache", "temp", "privacy", "windows", "macos", "linux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
window = ["pywebview>=5"]
trash = ["send2trash>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
voidsweep = "voidsweep.cli:main"

[project.urls]
Homepage = "https://github.com/versex-arch/voidsweep"
Issues = "https://github.com/versex-arch/voidsweep/issues"

[tool.setuptools.packages.find]
include = ["voidsweep", "voidsweep.*"]

[tool.setuptools.dynamic]
version = { attr = "voidsweep.__version__" }

[tool.setuptools.package-data]
"voidsweep.web" = ["*"]
